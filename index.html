<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fattoria CoMoTo｜ファットリアこもと</title>
<meta name="description" content="会津坂下町の農家レストラン「ファットリアこもと」。ホームページは準備中です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,200;1,300&family=M+PLUS+2:wght@400;500&display=swap">
<style>
:root{--bg:#ffffff;--fg:#1f2421;--muted:#636b66;--line:#e2e7e2;--tomato:#c8372a;--basil:#2f6d36;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141715;--fg:#eef1ee;--muted:#a3aca6;--line:#2d3430;--tomato:#ef6b5c;--basil:#7fc488;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"M PLUS 2","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:clamp(40px,8vw,88px) 20px 48px}
h1{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-style:italic;font-weight:200;font-size:clamp(2.8rem,10vw,4.6rem);line-height:1;margin:0}
.sub{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-style:italic;font-weight:300;color:var(--basil);margin:.6em 0 0}
img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;margin:32px 0}
.soon{font-size:1.15rem;font-weight:500;margin:0 0 .4em}
p{margin:0 0 1em}
dl{display:grid;grid-template-columns:6em minmax(0,1fr);margin:24px 0 0;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
dt{color:var(--muted);font-size:.9rem}
a{color:var(--tomato)}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:24px 20px 40px}
</style>
</head>
<body>
<main>
  <h1>Fattoria<br>CoMoTo</h1>
  <p class="sub">Soba cafe &amp; Farmer's restaurant</p>
  <img src="images/exterior.jpg" alt="ファットリアこもとの外観">
  <p class="soon">ホームページは現在準備中です。</p>
  <p>会津坂下町坂本の農家レストラン「ファットリアこもと」です。最新の情報はInstagramでお知らせしています。</p>
  <dl>
    <dt>住所</dt><dd>〒969-6586 福島県河沼郡会津坂下町坂本糠塚乙1144</dd>
    <dt>電話</dt><dd>0242-83-1101</dd>
    <dt>営業時間</dt><dd>11:00〜15:00／17:00〜20:00</dd>
    <dt>定休日</dt><dd>月曜日・第3火曜日</dd>
    <dt>Instagram</dt><dd><a href="https://www.instagram.com/fattoria.comoto" target="_blank" rel="noopener">@fattoria.comoto</a></dd>
  </dl>
</main>
<footer>株式会社ファットリアこもと</footer>
</body>
</html>
